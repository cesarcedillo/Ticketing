version: "3.8"

services:
  ticketing-ticket-ticket:
    build:
      context: ./Backend
      dockerfile: ./Dockerfiles/Dockerfile.ticket
    ports:
      - "5003:80"
    env_file:
      - ./Configuration/authentication.env
      - ./Configuration/ticket.env
      - ./Configuration/brokerConfigurations.env
    environment:
      - RunningInDocker=true
      - RepositoryConnection=Data Source=/app/db.db
      - RabbitMQConnection=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz/ready >/dev/null || curl -fsS http://localhost/healthcheck >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - ticketing-micro-net

  ticketing-ticket-auth:
    build:
      context: ./Backend
      dockerfile: ./Dockerfiles/Dockerfile.auth
    ports:
      - "5001:80"
    env_file:
      - ./Configuration/authentication.env
      - ./Configuration/auth.env
    environment:
      - RunningInDocker=true
      - RepositoryConnection=Data Source=/app/db.db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz/ready >/dev/null || curl -fsS http://localhost/healthcheck >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - ticketing-micro-net

  ticketing-ticket-user:
    build:
      context: ./Backend
      dockerfile: ./Dockerfiles/Dockerfile.user
    ports:
      - "5002:80"
    env_file:
      - ./Configuration/authentication.env
      - ./Configuration/user.env
    environment:
      - RunningInDocker=true
      - RepositoryConnection=Data Source=/app/db.db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz/ready >/dev/null || curl -fsS http://localhost/healthcheck >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - ticketing-micro-net

  ticketing-ticket-bff:
    build:
      context: ./Backend
      dockerfile: ./Dockerfiles/Dockerfile.bff
    ports:
      - "5000:80"
    env_file:
      - ./Configuration/authentication.env
      - ./Configuration/bff.env
    environment:
      - RunningInDocker=true
      - AuthClientUrl=http://ticketing-ticket-auth/
      - UserClientUrl=http://ticketing-ticket-user/
      - TicketClientUrl=http://ticketing-ticket-ticket/
    depends_on:
      ticketing-ticket-user:
        condition: service_healthy
      ticketing-ticket-auth:
        condition: service_healthy
      ticketing-ticket-ticket:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz/ready >/dev/null || curl -fsS http://localhost/healthcheck >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - ticketing-micro-net

  ticketing-ticket-notifications:
    build:
      context: ./Backend
      dockerfile: ./Dockerfiles/Dockerfile.notifications
    ports:
      - "5004:80"
    env_file:
      - ./Configuration/authentication.env
      - ./Configuration/notifications.env
      - ./Configuration/brokerConfigurations.env
    environment:
      - RunningInDocker=true
      - RepositoryConnection=Data Source=/app/db.db
      - RabbitMQConnection=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz/ready >/dev/null || curl -fsS http://localhost/healthcheck >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - ticketing-micro-net

  ticketing-frontend:
    build:
      context: ./Frontend/Ticketing
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      ticketing-ticket-bff:
        condition: service_healthy
    networks:
      - ticketing-micro-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - ticketing-micro-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ticketing-micro-net
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s


networks:
  ticketing-micro-net:
    name: ticketing-micro-net
    driver: bridge
