name: CI - Unit (per-solution) + E2E (Ephemeral)

on:
  push:
    branches: ["Phase-3"]
  pull_request:
    branches: ["Phase-3"]
  workflow_dispatch:

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/nuget.config', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Unit tests per solution
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for backend solutions..."
          mapfile -t SLNS < <(find Backend -name "*.sln" -type f | sort)

          if [ ${#SLNS[@]} -eq 0 ]; then
            echo "No .sln files found under Backend/"
            exit 1
          fi

          echo "Found solutions:"
          printf '%s\n' "${SLNS[@]}"

          for sln in "${SLNS[@]}"; do
            if echo "$sln" | grep -qi "e2e"; then
              echo "Skipping (E2E solution): $sln"
              continue
            fi

            echo "----"
            echo "Restore: $sln"
            dotnet restore "$sln"

            echo "Build: $sln"
            dotnet build "$sln" -c Release --no-restore

            echo "Test:  $sln"
            dotnet test "$sln" -c Release --no-build \
              --logger "trx;LogFileName=$(basename "$sln").unit.trx"
          done

      - name: Docker Compose Up (build)
        run: |
          docker compose version
          docker compose up -d --build

      - name: Wait for BFF ready
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for BFF at http://localhost:5000/healthz/ready"
          for i in {1..60}; do
            if curl -fsS "http://localhost:5000/healthz/ready" > /dev/null; then
              echo "BFF is ready"
              exit 0
            fi
            sleep 2
          done
          echo "BFF was not ready in time"
          docker compose ps
          exit 1

      - name: E2E tests
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for E2E csproj under Backend..."
          # Intento 1: ruta típica
          if [ -f "Backend/tests/Ticketing.E2E/Ticketing.E2E.csproj" ]; then
            E2E_PROJ="Backend/tests/Ticketing.E2E/Ticketing.E2E.csproj"
          else
            # Intento 2: detección por nombre
            E2E_PROJ="$(find Backend -name "*E2E*.csproj" -type f | head -n 1 || true)"
          fi

          if [ -z "${E2E_PROJ:-}" ]; then
            echo "E2E project not found. Ensure it contains 'E2E' in its csproj name or is at Backend/tests/Ticketing.E2E/."
            exit 1
          fi

          echo "Using E2E project: $E2E_PROJ"
          dotnet restore "$E2E_PROJ"
          dotnet test "$E2E_PROJ" -c Release \
            --logger "trx;LogFileName=e2e-tests.trx"

      - name: Docker Compose Logs (always)
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color > docker-compose.log

      - name: Upload test results + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            **/TestResults/**/*.trx
            docker-compose.log

      - name: Docker Compose Down (always)
        if: always()
        run: |
          docker compose down -v --remove-orphans
