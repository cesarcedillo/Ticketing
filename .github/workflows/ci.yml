name: CI - Unit (per-solution) + E2E (Ephemeral)

on:
  push:
    branches: ["Phase-3"]
  pull_request:
    branches: ["Phase-3"]
  workflow_dispatch:

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      DOTNET_VERSION: "9.0.x"
      CONFIGURATION: "Release"
      RUN_UNITS: "true"
      RUN_E2E: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/nuget.config', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Print versions
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          docker --version
          docker compose version

      - name: Run CI Orchestrator (Units + E2E)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ci/run-ci.sh
          RUN_UNITS="${RUN_UNITS}" RUN_E2E="${RUN_E2E}" CONFIGURATION="${CONFIGURATION}" bash ci/run-ci.sh

      - name: Upload logs + test results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          if-no-files-found: warn
          path: |
            ci-logs/**
            TestResults/**/*.trx
            **/TestResults/**/*.trx
            docker-compose.log
            **/docker-compose.log
